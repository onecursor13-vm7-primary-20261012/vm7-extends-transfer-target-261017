name: VM7 extends external Read protected deployment 261018

on:
  push:
    branches:
      - vm7-extends-read-secret-sensitive-261018
    paths:
      - deploy-vm7-extends-read-secret.sh

permissions:
  contents: read

jobs:
  protected-deployment:
    runs-on: ubuntu-latest
    environment: vm7-extends-read-secret-env-261018
    env:
      VM7_EXTENDS_PROTECTED_SECRET: ${{ secrets.VM7_EXTENDS_PROTECTED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected deployment hook
        run: bash deploy-vm7-extends-read-secret.sh
      - name: Preserve controlled proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm7-extends-read-secret-proof-261018
          path: /tmp/vm7-extends-read-secret-proof
          if-no-files-found: error
